<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Last Offer</title>
<!-- ============================================================
     EDIT-ME CHECKLIST
     1. Shown only if someone declines the size-upgrade upsell.
     2. Default offer here is upgrading just ONE print (the lead image)
        instead of all three — smaller ask, smaller price.
     3. Replace STRIPE_PAYMENT_LINK_DOWNSELL with its own Payment Link.
     4. "No thanks" goes to thank-you.html
     ============================================================ -->
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div class="center-page">
  <div class="wrap">
    <div class="offer-card">
      <div class="badge">Last Chance</div>
      <h1>Just the lead print, then?</h1>
      <p class="subhead">
        No pressure on upgrading the whole series — but you can still upgrade
        just [Photo Title] to 24&quot;×36&quot; for a smaller difference.
      </p>

      <div class="price-row" style="justify-content:center;">
        <span class="price">+$[DOWNSELL_UPGRADE_PRICE]</span>
        <span class="price-note">to upgrade one print to 24&quot;×36&quot;</span>
      </div>

      <div class="offer-actions">
        <a href="STRIPE_PAYMENT_LINK_DOWNSELL" class="btn">Upgrade This One — +$[DOWNSELL_UPGRADE_PRICE]</a>
        <a href="thank-you.html" class="btn-ghost">No thanks, I'm all set</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
